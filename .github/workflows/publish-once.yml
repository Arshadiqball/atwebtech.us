name: Publish once (temporary)

# Temporary read-only check of which PHP the scheduled runs use. Remove after use.

on:
  workflow_dispatch:

env:
  DEPLOY_HOST: vda2000.is.cc
  DEPLOY_USER: atwebtec
  DEPLOY_PATH: domains/atwebtech.us/public_html

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: PHP 8.5 check
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH=$DEPLOY_PATH bash -s" <<'EOF'
          cd "$DEPLOY_PATH"
          P=/usr/local/php85/bin/php
          echo "== $($P -v 2>/dev/null | head -1 | cut -c1-30); curl loaded: $($P -m 2>/dev/null | grep -cx curl); pdo_mysql: $($P -m 2>/dev/null | grep -cx pdo_mysql); sodium: $($P -m 2>/dev/null | grep -cx sodium)"
          echo "== files PHP 8.5 refuses to compile:"
          for f in app/*.php app/**/*.php bin/*.php; do [ -f "$f" ] && $P -l "$f" 2>&1 | grep -v '^No syntax errors' | grep -v 'i360.so' | sed -E 's#/home/[^/ ]+#~#g' | cut -c1-200; done
          echo "== load every class under 8.5:"
          $P -d display_errors=1 -d error_reporting=E_ALL -r 'require "app/bootstrap.php"; foreach (glob("app/*.php") as $f) { $c = basename($f, ".php"); if (!class_exists($c)) { echo "   not a class: $c\n"; } } echo "   done\n";' 2>&1 | grep -v 'i360.so' | grep -vE 'Deprecated' | sed -E 's#/home/[^/ ]+#~#g' | cut -c1-220 | head -20
          echo "== deprecations under 8.5 (first 8):"
          $P -d display_errors=1 -d error_reporting=E_ALL -r 'require "app/bootstrap.php"; foreach (glob("app/*.php") as $f) { class_exists(basename($f, ".php")); }' 2>&1 | grep -E 'Deprecated' | sed -E 's#/home/[^/ ]+#~#g' | sort -u | cut -c1-220 | head -8
          echo "== error log settings under 8.5: display_errors=$($P -r 'echo ini_get("display_errors");') log_errors=$($P -r 'echo ini_get("log_errors");') error_log=$($P -r 'echo ini_get("error_log") ?: "(stderr)";' | sed -E 's#/home/[^/ ]+#~#g')"
          EOF
