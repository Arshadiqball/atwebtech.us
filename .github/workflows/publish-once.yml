name: Publish once (temporary)

# Temporary read-only check of which PHP the scheduled runs use. Remove after use.

on:
  workflow_dispatch:

env:
  DEPLOY_HOST: vda2000.is.cc
  DEPLOY_USER: atwebtec
  DEPLOY_PATH: domains/atwebtech.us/public_html

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Which PHP
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH=$DEPLOY_PATH bash -s" <<'EOF'
          cd "$DEPLOY_PATH"
          for b in /usr/local/bin/php /usr/bin/php $(command -v php) $(command -v php8.2) $(command -v php8.3) /usr/local/php82/bin/php; do
            [ -x "$b" ] && echo "   $b -> $($b -v 2>/dev/null | head -1 | cut -c1-40)"
          done | sort -u
          echo "== scheduled publish.php runs seen over 70 seconds (pid, php binary):"
          end=$(( $(date +%s) + 70 ))
          while [ $(date +%s) -lt $end ]; do
            for d in /proc/[0-9]*; do
              grep -q 'bin/publish.php' $d/cmdline 2>/dev/null && echo "   ${d#/proc/} $(readlink $d/exe 2>/dev/null) $(tr '\0' ' ' < $d/cmdline | grep -oE '(-[a-z] [^ ]+ )*' | head -c 60)"
            done
            sleep 1
          done | sort -u | head -10
          EOF
