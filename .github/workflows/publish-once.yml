name: Publish once (temporary)

# Temporary read-only check of which PHP the scheduled runs use. Remove after use.

on:
  workflow_dispatch:

env:
  DEPLOY_HOST: vda2000.is.cc
  DEPLOY_USER: atwebtec
  DEPLOY_PATH: domains/atwebtech.us/public_html

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: PHP limits
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH=$DEPLOY_PATH bash -s" <<'EOF'
          cd "$DEPLOY_PATH"
          for P in /usr/local/php82/bin/php /usr/local/php85/bin/php; do
            echo "== $P"
            $P -r 'foreach (["max_execution_time","memory_limit","disable_functions","open_basedir","default_socket_timeout","error_log","log_errors"] as $k) { $v = (string) ini_get($k); echo "   $k = " . (strlen($v) > 160 ? substr($v, 0, 160) . "..." : $v) . "\n"; } echo "   ini file = " . php_ini_loaded_file() . "\n";' 2>/dev/null | sed -E 's#/home/[^/ ]+#~#g'
          done
          echo "== run the publisher under PHP 8.5 by hand, nothing is due (limit 90s):"
          start=$(date +%s); timeout 90 /usr/local/php85/bin/php -d display_errors=1 bin/publish.php > /tmp/p85.out 2>&1; code=$?; end=$(date +%s)
          echo "   exit $code after $((end-start))s"
          grep -v 'i360.so' /tmp/p85.out | sed -E 's#/home/[^/ ]+#~#g; s#[A-Za-z0-9_-]{32,}#<long>#g' | cut -c1-200 | tail -n 15
          EOF
