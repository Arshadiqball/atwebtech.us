name: Server check (temporary)

# Temporary read-only check for stuck PHP web requests. Prints a cleaned summary only (public logs).

on:
  workflow_dispatch:

env:
  DEPLOY_HOST: vda2000.is.cc
  DEPLOY_USER: atwebtec
  DEPLOY_PATH: domains/atwebtech.us/public_html

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Load the site from GitHub's network
        run: |
          for u in / /robots.txt /login; do curl -s -o /dev/null -m 20 -w "$u %{http_code} %{time_total}s\n" "https://atwebtech.us$u" || echo "$u timeout"; done

      - name: Look for stuck PHP requests
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH=$DEPLOY_PATH bash -s" <<'EOF'
          cd "$DEPLOY_PATH"
          echo "== PHP processes (pid, elapsed, program, open session files, script):"
          for d in /proc/[0-9]*; do
            c=$(tr '\0' ' ' < $d/cmdline 2>/dev/null)
            case "$c" in *php*)
              p=${d#/proc/}
              s=$(ls -l $d/fd 2>/dev/null | grep -c 'sess_')
              f=$(ls -l $d/fd 2>/dev/null | grep -oE 'public_html/[^ ]+\.php' | head -1)
              echo "   $p $(ps -o etime= -p $p 2>/dev/null | tr -d ' ') $(echo "$c" | awk '{print $1}' | sed -E 's#.*/##') state=$(awk '/^State/{print $2}' $d/status 2>/dev/null) sess=$s $f";;
            esac
          done | sort -k2 -r | head -40
          echo "== session files touched in the last 2 hours: $(find storage/sessions -name 'sess_*' -mmin -120 2>/dev/null | wc -l) of $(ls storage/sessions 2>/dev/null | wc -l)"
          echo "== session files locked right now:"
          n=0; for f in storage/sessions/sess_*; do flock -n -s "$f" true 2>/dev/null || { n=$((n+1)); echo "   locked, last changed $(date -u -r "$f" '+%F %T') UTC"; }; done; echo "   total locked: $n"
          echo "== LiteSpeed/lsphp limits if visible:"
          cat /proc/self/limits 2>/dev/null | grep -iE "processes|open files" | sed 's/^/   /'
          echo "== load: $(cat /proc/loadavg)"
          echo "== php-error.log, last 8 lines, cleaned:"
          tail -n 8 storage/logs/php-error.log 2>/dev/null | sed -E 's#[A-Za-z0-9_-]{32,}#<long>#g; s#/home/[^/ ]+#~#g' | cut -c1-200
          EOF
