name: Health report (one-off)

# Temporary, read-only. Prints counts per network only: no names, emails, ids or tokens,
# because this repository's Actions logs are public. Removed right after it runs.

on:
  workflow_dispatch:

env:
  DEPLOY_HOST: vda2000.is.cc
  DEPLOY_USER: atwebtec
  DEPLOY_PATH: domains/atwebtech.us/public_html

jobs:
  report:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Report
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH=$DEPLOY_PATH bash -s" <<'EOF'
          cd "$DEPLOY_PATH"
          echo "== publish.log: runs per hour, last 24h (from the publisher's own summary lines)"
          grep -hoE '^\[[0-9T:-]{13}' storage/logs/publish.log 2>/dev/null | tail -n 3000 | sort | uniq -c | tail -n 26
          echo "== last 5 summary lines"
          grep -hE 'sent [0-9]+, retry' storage/logs/publish.log 2>/dev/null | tail -n 5 | sed -E 's/[A-Za-z0-9_-]{24,}/<long>/g' | cut -c1-160
          echo "== crontab lines mentioning publish (program only)"
          crontab -l 2>/dev/null | grep -i publish | sed -E 's#/home/[^ ]+#~#g' | cut -c1-160
          /usr/local/php82/bin/php -r '
          require "app/bootstrap.php";
          $db = Database::connection();
          echo "== raw counts: users ", $db->query("SELECT COUNT(*) FROM users")->fetchColumn(), ", channels ", $db->query("SELECT COUNT(*) FROM channels")->fetchColumn(), ", posts ", $db->query("SELECT COUNT(*) FROM posts")->fetchColumn(), ", posts planned ", $db->query("SELECT COUNT(*) FROM posts WHERE status=\"planned\"")->fetchColumn(), ", posts sent ", $db->query("SELECT COUNT(*) FROM posts WHERE status=\"sent\"")->fetchColumn(), "\n";
          $clean = static fn (string $s): string => mb_substr(preg_replace(["#https?://\S+#", "/\d{3,}/", "/[A-Za-z0-9_-]{20,}/"], ["<url>", "<n>", "<id>"], $s), 0, 110);
          echo "== connect available (keys configured)\n";
          foreach (["facebook","instagram","threads","linkedin","youtube","pinterest","tiktok","bluesky","mastodon"] as $p) {
              echo "   $p: ", Channels::connectable($p) ? "yes" : "NO", $p === "linkedin" ? " (pages app: " . (Channels::linkedinPagesReady() ? "yes" : "no") . ")" : "", $p === "pinterest" ? " (full oauth: " . (Channels::pinterestOAuthReady() ? "yes" : "sandbox only") . ")" : "", "\n";
          }
          echo "   COMMUNITY_PERMISSIONS=", Env::get("COMMUNITY_PERMISSIONS", ""), " STATS_PERMISSIONS=", Env::get("STATS_PERMISSIONS", "instagram,threads"), "\n";
          echo "== connected channels: network kind | total, can publish, paused, token expired\n";
          $rows = [];
          foreach ($db->query("SELECT DISTINCT user_id FROM channels")->fetchAll(PDO::FETCH_COLUMN) as $uid) {
              foreach (Channels::forUser((int) $uid) as $c) {
                  $k = $c["provider"] . " " . ($c["kind"] ?: "-");
                  $rows[$k] ??= [0, 0, 0, 0];
                  $rows[$k][0]++;
                  $rows[$k][1] += $c["can_publish"] ? 1 : 0;
                  $rows[$k][2] += $c["paused_at"] !== null ? 1 : 0;
              }
          }
          foreach ($db->query("SELECT provider, kind, token_expires_at FROM channels") as $c) {
              $k = $c["provider"] . " " . ($c["kind"] ?: "-");
              if ($c["token_expires_at"] && strtotime($c["token_expires_at"] . " UTC") < time() && isset($rows[$k])) { $rows[$k][3]++; }
          }
          ksort($rows);
          foreach ($rows as $k => [$t, $p, $pa, $ex]) { echo "   $k | $t, $p, $pa, $ex\n"; }
          echo "== posts last 14 days by network and status\n";
          $q = $db->query("SELECT COALESCE(c.provider, CONCAT(p.channel, \" (no channel)\")) net, p.status, COUNT(*) n FROM posts p LEFT JOIN channels c ON c.id = p.channel_id WHERE p.planned_at >= UTC_TIMESTAMP() - INTERVAL 14 DAY OR p.sent_at >= UTC_TIMESTAMP() - INTERVAL 14 DAY GROUP BY net, p.status ORDER BY net, p.status");
          foreach ($q as $r) { echo "   {$r["net"]} {$r["status"]}: {$r["n"]}\n"; }
          echo "== overdue now (scheduled, connected, not paused, time passed)\n";
          foreach ($db->query("SELECT c.provider, COUNT(*) n, MIN(p.planned_at) oldest FROM posts p JOIN channels c ON c.id = p.channel_id WHERE p.status = \"planned\" AND c.paused_at IS NULL AND p.planned_at < UTC_TIMESTAMP() - INTERVAL 10 MINUTE GROUP BY c.provider") as $r) { echo "   {$r["provider"]}: {$r["n"]}, oldest due {$r["oldest"]} UTC\n"; }
          echo "== lateness of sent posts, last 14 days (minutes after their time)\n";
          foreach ($db->query("SELECT c.provider, COUNT(*) n, ROUND(AVG(TIMESTAMPDIFF(MINUTE, p.planned_at, p.sent_at))) avg_late, MAX(TIMESTAMPDIFF(MINUTE, p.planned_at, p.sent_at)) max_late, MAX(p.sent_at) last_sent FROM posts p JOIN channels c ON c.id = p.channel_id WHERE p.status = \"sent\" AND p.sent_at >= UTC_TIMESTAMP() - INTERVAL 14 DAY GROUP BY c.provider") as $r) { echo "   {$r["provider"]}: {$r["n"]} sent, avg {$r["avg_late"]} min late, worst {$r["max_late"]} min, last {$r["last_sent"]} UTC\n"; }
          echo "== failure reasons, last 14 days\n";
          foreach ($db->query("SELECT c.provider, p.error FROM posts p JOIN channels c ON c.id = p.channel_id WHERE p.status = \"failed\" AND p.updated_at >= UTC_TIMESTAMP() - INTERVAL 14 DAY") as $r) { $f[$r["provider"] . ": " . $clean((string) $r["error"])] = ($f[$r["provider"] . ": " . $clean((string) $r["error"])] ?? 0) + 1; }
          foreach ($f ?? [] as $k => $n) { echo "   $n x $k\n"; }
          echo "== channel health errors (stats/inbox)\n";
          foreach ($db->query("SELECT provider, stats_error, inbox_error FROM channels WHERE stats_error IS NOT NULL OR inbox_error IS NOT NULL") as $r) { $h[$r["provider"] . ": " . $clean((string) ($r["stats_error"] ?: $r["inbox_error"]))] = ($h[$r["provider"] . ": " . $clean((string) ($r["stats_error"] ?: $r["inbox_error"]))] ?? 0) + 1; }
          foreach ($h ?? [] as $k => $n) { echo "   $n x $k\n"; }
          ' 2>&1 | sed -E 's#/home/[^ ]+#~#g; s/[A-Za-z0-9_-]{32,}/<long>/g' | grep -v "i360.so"
          echo "== account deletions and channel revokes in php-error.log (timestamps only)"
          grep -hE "deleted by (an admin|its owner)|token revoke failed|admin channel revoke" storage/logs/php-error.log 2>/dev/null | sed -E 's/^\[([^]]+)\].*(deleted by an admin|deleted by its owner|token revoke failed|admin channel revoke failed).*/\1 \2/' | tail -n 40
          echo "== crontab (programs only, all lines)"
          crontab -l 2>&1 | sed -E 's#/home/[^ ]+#~#g; s/[A-Za-z0-9_-]{24,}/<long>/g' | cut -c1-160
          EOF
