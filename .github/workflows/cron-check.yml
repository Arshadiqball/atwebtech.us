name: Cron check (one-off)

# Temporary, read-only: reads when bin/publish.php last ran, twice, 75 seconds apart. Removed after it runs.

on:
  workflow_dispatch:

env:
  DEPLOY_HOST: vda2000.is.cc
  DEPLOY_USER: atwebtec
  DEPLOY_PATH: domains/atwebtech.us/public_html

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Read the heartbeat twice
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH=$DEPLOY_PATH bash -s" <<'EOF'
          cd "$DEPLOY_PATH"
          echo "now $(date -u +%FT%TZ) heartbeat: $(cat storage/logs/publish.heartbeat 2>/dev/null || echo none)"
          sleep 75
          echo "now $(date -u +%FT%TZ) heartbeat: $(cat storage/logs/publish.heartbeat 2>/dev/null || echo none)"
          echo "== new publish.log lines today"
          grep -h "^\[$(date -u +%F)" storage/logs/publish.log 2>/dev/null | tail -n 5 | cut -c1-160
          echo "== last PHP errors mentioning publish or fatal"
          grep -hiE "fatal|publish" storage/logs/php-error.log 2>/dev/null | tail -n 3 | sed -E 's/[A-Za-z0-9_-]{32,}/<long>/g; s#/home/[^ ]+#~#g' | cut -c1-200
          EOF
