name: Set admin login (one-off)

# Temporary: writes ADMIN_USER and ADMIN_PASSWORD_HASH into the server's .env from the
# production environment secret. Prints nothing about the value. Removed right after it runs.

on:
  workflow_dispatch:

env:
  DEPLOY_HOST: vda2000.is.cc
  DEPLOY_USER: atwebtec
  DEPLOY_PATH: domains/atwebtech.us/public_html

jobs:
  set:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Write the admin login into the server .env
        env:
          HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: |
          H64=$(printf '%s' "$HASH" | base64 -w0)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "H64=$H64 DEPLOY_PATH=$DEPLOY_PATH bash -s" <<'EOF'
          set -e
          cd "$DEPLOY_PATH"
          h=$(printf '%s' "$H64" | base64 -d)
          case "$h" in '$2y$'*) ;; *) echo "hash missing"; exit 1;; esac
          cp -p .env ".env.backup-admin-$(date +%Y%m%d%H%M%S)"
          { grep -v -E '^(ADMIN_USER|ADMIN_PASSWORD_HASH)=' .env || true; printf "ADMIN_USER=admin\nADMIN_PASSWORD_HASH='%s'\n" "$h"; } > .env.new
          cat .env.new > .env
          rm -f .env.new
          /usr/local/php82/bin/php -r 'require "app/bootstrap.php"; echo (strlen((string) config("admin.password_hash")) === 60 && config("admin.user") === "admin") ? "admin login set" : "admin login NOT set", PHP_EOL;' 2>/dev/null
          EOF
